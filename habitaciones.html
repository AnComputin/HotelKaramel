<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitaciones — Hotel Karamel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Cabecera unificada -->
    <header class="hero-secundario">
        <nav class="navbar navbar-expand-lg navbar-dark navbar-karamel">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="img/logo.png" alt="Hotel Karamel" class="logo-img">
                </a>
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active" href="habitaciones.html">Habitaciones</a></li>
                        <li class="nav-item"><a class="nav-link" href="reservas.html">Reservas</a></li>
                        <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container text-center py-2">
            <h1 class="titulo-pagina">Nuestras Habitaciones</h1>
        </div>
    </header>

    <main class="container">

        <!-- ===== R.13 Filtro de habitaciones ===== -->
        <section class="pb-0">
            <div class="row justify-content-center g-3 mb-4">
                <div class="col-auto">
                    <label for="filtro-tipo" class="form-label">Tipo de habitación</label>
                    <select id="filtro-tipo" class="form-select">
                        <option value="todas">Todas</option>
                        <option value="individual">Individual</option>
                        <option value="doble">Doble</option>
                        <option value="suite">Suite</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label for="filtro-precio" class="form-label">Precio máximo</label>
                    <select id="filtro-precio" class="form-select">
                        <option value="0">Sin límite</option>
                        <option value="50000">Hasta $50.000</option>
                        <option value="80000">Hasta $80.000</option>
                        <option value="150000">Hasta $150.000</option>
                    </select>
                </div>
            </div>

            <!-- ===== R.9 Contador de habitaciones disponibles ===== -->
            <p class="text-center">
                Habitaciones disponibles: <strong id="contador-disponibles">0</strong>
            </p>
        </section>

        <!-- ===== R.2 Galería de habitaciones ===== -->
        <section class="pt-0">
            <div class="row g-4" id="lista-habitaciones">
                <!-- Este contenedor se llena 100% dinámicamente desde js/habitaciones.js
                     (array `habitaciones`, función renderizarHabitaciones). No agregar cards
                     a mano acá: se borrarían apenas cargue la página. -->
            </div>
        </section>

    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/habitaciones-data.js"></script>
    <script src="js/habitaciones.js"></script>
    <script src="js/footer.js" defer></script>
</body>
</html>
