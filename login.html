
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | Hotel Karamel</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS principal -->
    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


    <!-- ============================================
         NAVBAR
         ============================================ -->

    <nav class="navbar navbar-expand-lg navbar-dark navbar-karamel">

        <div class="container">


            <!-- LOGO -->

            <a
                class="navbar-brand"
                href="index.html"
            >

                <img
                    src="img/logo.png"
                    alt="Hotel Karamel"
                    class="logo-img"
                >

            </a>



            <!-- BOTÓN RESPONSIVE -->

            <button
                class="navbar-toggler ms-auto"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu"
            >

                <span class="navbar-toggler-icon"></span>

            </button>



            <!-- MENÚ -->

            <div
                class="collapse navbar-collapse"
                id="navMenu"
            >

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="index.html"
                        >
                            Inicio
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="habitaciones.html"
                        >
                            Habitaciones
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="reservas.html"
                        >
                            Reservas
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="servicios.html"
                        >
                            Servicios
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="contacto.html"
                        >
                            Contacto
                        </a>
                    </li>

                </ul>


            </div>


        </div>

    </nav>



    <!-- ============================================
         LOGIN
         ============================================ -->

    <main class="auth-page">


        <section class="auth-container">


            <!-- ENCABEZADO -->

            <div class="auth-header">

                <h1>Bienvenido nuevamente</h1>

                <p>
                    Inicia sesión para gestionar tus reservas
                    en Hotel Karamel.
                </p>

            </div>



            <!-- FORMULARIO -->

            <form
                id="formLogin"
                class="auth-form"
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">

                        Correo electrónico

                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ejemplo@email.com"
                        required
                    >

                </div>



                <!-- CONTRASEÑA -->

                <div class="form-group">

                    <label for="password">

                        Contraseña

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>



                <!-- MENSAJE -->

                <div
                    id="mensajeLogin"
                    class="auth-message"
                ></div>



                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn btn-karamel auth-btn"
                >

                    Iniciar sesión

                </button>


            </form>



            <!-- REGISTRO -->

            <div class="auth-footer">

                <p>

                    ¿Aún no tienes una cuenta?

                    <a href="registro.html">

                        Crear cuenta

                    </a>

                </p>

            </div>


        </section>


    </main>



    <!-- ============================================
         SCRIPTS
         ============================================ -->

    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Sistema de autenticación -->
    <script src="js/auth.js"></script>


    <!-- Login -->
    <script src="js/main.js"></script>
    <script src="js/login.js"></script>


</body>

</html>
