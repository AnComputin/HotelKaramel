<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta | Hotel Karamel</title>


    <!-- ============================================
         BOOTSTRAP
         ============================================ -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ============================================
         BOOTSTRAP ICONS
         ============================================ -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- ============================================
         CSS PRINCIPAL
         ============================================ -->

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


    <!-- ============================================
         NAVBAR
         ============================================ -->

    <nav
        class="
            navbar
            navbar-expand-lg
            navbar-dark
            navbar-karamel
        "
    >

        <div class="container">


            <!-- LOGO -->

            <a
                class="navbar-brand"
                href="index.html"
            >

                <img
                    src="img/logo.png"
                    alt="Hotel Karamel"
                    class="logo-img"
                >

            </a>



            <!-- BOTÓN MÓVIL -->

            <button
                class="navbar-toggler ms-auto"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu"
                aria-controls="navMenu"
                aria-expanded="false"
                aria-label="Abrir navegación"
            >

                <span class="navbar-toggler-icon"></span>

            </button>



            <!-- MENÚ -->

            <div
                class="collapse navbar-collapse"
                id="navMenu"
            >

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="index.html"
                        >
                            Inicio
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="habitaciones.html"
                        >
                            Habitaciones
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="reservas.html"
                        >
                            Reservas
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="servicios.html"
                        >
                            Servicios
                        </a>
                    </li>


                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="contacto.html"
                        >
                            Contacto
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- ============================================
         CONTENIDO PRINCIPAL
         ============================================ -->

    <main class="auth-page">


        <section class="auth-container">


            <!-- ====================================
                 TÍTULO
                 ==================================== -->

            <div class="auth-header">

                <h1>
                    Crear una cuenta
                </h1>

                <p>
                    Regístrate para gestionar tus reservas
                    en Hotel Karamel.
                </p>

            </div>



            <!-- ====================================
                 FORMULARIO
                 ==================================== -->

            <form
                id="formRegistro"
                class="auth-form"
            >


                <!-- NOMBRE -->

                <div class="form-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre completo"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ejemplo@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- CONTRASEÑA -->

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Crea una contraseña"
                        autocomplete="new-password"
                        required
                    >

                </div>



                <!-- CONFIRMAR CONTRASEÑA -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repite tu contraseña"
                        autocomplete="new-password"
                        required
                    >

                </div>



                <!-- MENSAJE -->

                <div
                    id="mensajeRegistro"
                    class="auth-message"
                ></div>



                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="
                        btn
                        btn-karamel
                        auth-btn
                    "
                >

                    <i class="bi bi-person-plus"></i>

                    Crear cuenta

                </button>


            </form>



            <!-- ====================================
                 LOGIN
                 ==================================== -->

            <div class="auth-footer">

                <p>

                    ¿Ya tienes una cuenta?

                    <a href="login.html">
                        Inicia sesión
                    </a>

                </p>

            </div>


        </section>


    </main>



    <!-- ============================================
         SCRIPTS
         ============================================ -->


    <!-- Bootstrap -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Autenticación -->

    <script src="js/auth.js"></script>


    <!-- Menú principal -->

    <script src="js/main.js"></script>


    <!-- Registro -->

    <script src="js/registro.js"></script>


</body>

</html>
