<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil — Hotel Karamel</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Menú de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-karamel navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Hotel Karamel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="habitaciones.html">Habitaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="reservas.html">Reservas</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="perfil.html">Mi Perfil</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Encabezado -->
    <header class="hero-karamel py-4">
        <div class="container text-center">
            <h1>Mi Perfil</h1>
        </div>
    </header>

    <main class="container my-5">
        <div class="row">
            
            <!-- Tarjeta con Información del Usuario (Columna Izquierda) -->
            <div class="col-md-4 mb-4">
                <div class="card card-karamel shadow-sm p-4 text-center">
                    <div class="mb-3">
                        <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px; font-size: 2rem;">
                            👤
                        </div>
                    </div>
                    <h4 id="nombre-usuario-perfil" class="fw-bold mb-1">Cargando...</h4>
                    <p id="email-usuario-perfil" class="text-muted mb-3">cargando@correo.com</p>
                    
                    <hr>
                    
                    <button onclick="cerrarSesion()" class="btn btn-outline-danger w-100 mt-2">
                        Cerrar Sesión
                    </button>
                </div>
            </div>

            <!-- Reservas del Usuario (Columna Derecha) -->
            <div class="col-md-8">
                
                <!-- Navegación por pestañas (Tabs) de Bootstrap -->
                <ul class="nav nav-tabs mb-4" id="perfilTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-semibold" id="activas-tab" data-bs-toggle="tab" data-bs-target="#activas" type="button" role="tab">
                            Reservas Activas
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-semibold" id="historial-tab" data-bs-toggle="tab" data-bs-target="#historial" type="button" role="tab">
                            Historial Pasado
                        </button>
                    </li>
                </ul>

                <!-- Contenido de las pestañas -->
                <div class="tab-content" id="perfilTabsContent">
                    
                    <!-- Pestaña 1: Reservas Activas -->
                    <div class="tab-pane fade show active" id="activas" role="tabpanel">
                        <div id="reservas-activas">
                            <!-- JS insertará dinámicamente las cards aquí -->
                        </div>
                    </div>

                    <!-- Pestaña 2: Historial Pasado -->
                    <div class="tab-pane fade" id="historial" role="tabpanel">
                        <div id="reservas-historial">
                            <!-- JS insertará dinámicamente las cards aquí -->
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </main>

    <!-- Pie de página -->
    <footer class="footer-karamel mt-5">
        <div class="container text-center py-3">
            <p class="mb-0">&copy; 2026 Hotel Karamel. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap & Scripts del Proyecto -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/auth.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
