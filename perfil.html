<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi perfil | Hotel Karamel</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >


    <!-- Google Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet"
    >


    <!-- CSS del proyecto -->

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


    <!-- ============================================
         NAVBAR
         ============================================ -->

    <nav class="navbar navbar-expand-lg navbar-dark navbar-karamel">

        <div class="container">


            <!-- LOGO -->

            <a
                class="navbar-brand"
                href="index.html"
            >

                <img
                    src="img/logo.png"
                    alt="Hotel Karamel"
                    class="logo-img"
                >

            </a>



            <!-- BOTÓN RESPONSIVE -->

            <button
                class="navbar-toggler ms-auto"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu"
            >

                <span class="navbar-toggler-icon"></span>

            </button>



            <!-- MENÚ -->

            <div
                class="collapse navbar-collapse"
                id="navMenu"
            >

                <ul class="navbar-nav mx-auto">


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="index.html"
                        >
                            Inicio
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="habitaciones.html"
                        >
                            Habitaciones
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="reservas.html"
                        >
                            Reservas
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="servicios.html"
                        >
                            Servicios
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="contacto.html"
                        >
                            Contacto
                        </a>

                    </li>


                </ul>

            </div>


        </div>

    </nav>



    <!-- ============================================
         PERFIL
         ============================================ -->

    <main class="perfil-page">


        <div class="container py-5">


            <!-- TÍTULO -->

            <div class="perfil-header text-center">

                <i class="bi bi-person-circle perfil-icon"></i>

                <h1>Mi perfil</h1>

                <p>
                    Gestiona tu información y revisa
                    tus reservas.
                </p>

            </div>



            <div class="row justify-content-center g-4">


                <!-- ========================================
                     INFORMACIÓN DEL USUARIO
                     ======================================== -->

                <div class="col-12 col-lg-5">


                    <section class="perfil-card">


                        <h2>

                            <i class="bi bi-person"></i>

                            Información personal

                        </h2>


                        <div class="perfil-info">


                            <!-- NOMBRE -->

                            <div class="perfil-info-item">

                                <span class="perfil-info-label">

                                    Nombre

                                </span>


                                <strong
                                    id="perfilNombre"
                                >

                                    Cargando...

                                </strong>

                            </div>



                            <!-- EMAIL -->

                            <div class="perfil-info-item">

                                <span class="perfil-info-label">

                                    Correo electrónico

                                </span>


                                <strong
                                    id="perfilEmail"
                                >

                                    Cargando...

                                </strong>

                            </div>


                        </div>


                        <!-- BOTÓN CERRAR SESIÓN -->

                        <button
                            id="btnCerrarSesionPerfil"
                            class="btn btn-outline-danger w-100 mt-4"
                        >

                            <i class="bi bi-box-arrow-right"></i>

                            Cerrar sesión

                        </button>


                    </section>


                </div>



                <!-- ========================================
                     RESERVAS
                     ======================================== -->

                <div class="col-12 col-lg-7">


                    <section class="perfil-card">


                        <div
                            class="
                                d-flex
                                justify-content-between
                                align-items-center
                                mb-4
                            "
                        >

                            <h2 class="mb-0">

                                <i class="bi bi-calendar-check"></i>

                                Mis reservas

                            </h2>


                            <a
                                href="reservas.html"
                                class="btn btn-karamel"
                            >

                                <i class="bi bi-plus-circle"></i>

                                Nueva reserva

                            </a>


                        </div>



                        <!-- CONTENEDOR DE RESERVAS -->

                        <div
                            id="contenedorReservas"
                        >


                            <!-- ESTE CONTENIDO SE CREA
                                 DESDE perfil.js -->

                        </div>


                    </section>


                </div>


            </div>


        </div>


    </main>



    <!-- ============================================
         SCRIPTS
         ============================================ -->


    <!-- Bootstrap -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Autenticación -->

    <script src="js/auth.js"></script>


    <!-- Perfil -->

    <script src="js/perfil.js"></script>


</body>

</html>
